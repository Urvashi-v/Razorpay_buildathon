# =============================================================================
# The final model: selection and calibration. Phase 5.
#
# WHAT THIS FILE DECIDES AND WHAT IT DELIBERATELY DOES NOT
# --------------------------------------------------------
# It decides which candidates are tried and how the winner is picked. It does
# NOT contain a result. No metric appears here, and nothing in this file is
# read at scoring time - the shipped artefact carries its own configuration.
#
# Everything below is selected on the VALIDATION split. The test split is not
# read by any step this file configures; see `rto-sentinel final-test`.
# =============================================================================
version: 1

# The nonlinear model the specification names as primary. Rung 3 (logistic
# regression) remains in the ladder as the incumbent it has to beat - on Phase 4
# validation numbers it currently does beat it, which is a finding, not a
# formality. See docs/model_card.md for how that comparison came out.
base_rung: lightgbm

search:
  # Selected on PR-AUC over the validation split, NOT on net rupees. Net rupees
  # requires a threshold, and a threshold is only meaningful once probabilities
  # are calibrated - which happens after this step. Ranking quality is the part
  # of the model that calibration cannot fix, so it is what this step chooses.
  metric: pr_auc

  # Bootstrap iterations for each candidate's interval. Needed because the tie
  # rule below is stated in units of that interval, not because a search
  # statistic is a reported result.
  bootstrap_iterations: 200

  # THE 1-SE RULE. On ~2,000 validation rows the 95% interval on PR-AUC is about
  # +/-0.05, so a 0.005 gap between two candidates is noise and picking the
  # higher one is superstition. Every candidate within one standard error of the
  # best point estimate is treated as tied with it; among those, the SMALLEST
  # model wins, measured as trees x leaves.
  #
  # Standard practice in cross-validated model selection, and the right bias
  # here: the failure this search exists to fix was excess capacity.
  tie_rule: one_standard_error_then_smallest

  # A CAPACITY SWEEP, NOT A LEADERBOARD CHASE.
  #
  # Phase 4 measured the shipped rung-4 configuration at 0.962 train PR-AUC
  # against 0.443 validation - it had memorised the training window. The axis
  # that matters here is therefore capacity: number of trees, leaves per tree,
  # rows required per leaf, and the L2 penalty. Seven candidates spanning that
  # axis, each a coherent configuration rather than a grid point.
  #
  # The Phase 4 configuration is candidate 1 so the search is measured against
  # what it replaces rather than against nothing.
  candidates:
    - name: phase4_as_shipped
      note: "The rung-4 configuration Phase 4 measured. The incumbent."
      params:
        n_estimators: 600
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 40
        colsample_bytree: 0.8
        reg_lambda: 0.0

    - name: fewer_trees
      note: "Same shape, a third of the trees. Isolates trees from tree size."
      params:
        n_estimators: 200
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 40
        colsample_bytree: 0.8
        reg_lambda: 0.0

    - name: smaller_trees
      note: "Fewer leaves and a larger leaf minimum. Isolates tree size."
      params:
        n_estimators: 400
        learning_rate: 0.05
        num_leaves: 15
        min_child_samples: 80
        colsample_bytree: 0.8
        reg_lambda: 0.0

    - name: constrained
      note: "Both dials down together, the configuration Phase 4's diagnostic pointed at."
      params:
        n_estimators: 150
        learning_rate: 0.05
        num_leaves: 15
        min_child_samples: 60
        colsample_bytree: 0.8
        reg_lambda: 1.0

    - name: shallow_and_slow
      note: "Very small trees, low learning rate, many of them. The classic low-variance shape."
      params:
        n_estimators: 500
        learning_rate: 0.03
        num_leaves: 7
        min_child_samples: 100
        colsample_bytree: 0.7
        reg_lambda: 5.0

    - name: regularised
      note: "Phase 4 capacity held, heavy L2. Tests whether the penalty alone is enough."
      params:
        n_estimators: 600
        learning_rate: 0.05
        num_leaves: 31
        min_child_samples: 40
        colsample_bytree: 0.8
        reg_lambda: 20.0

    - name: minimal
      note: "Deliberately underpowered. If this wins, the signal is close to linear."
      params:
        n_estimators: 120
        learning_rate: 0.08
        num_leaves: 7
        min_child_samples: 120
        colsample_bytree: 0.7
        reg_lambda: 5.0

calibration:
  # Cross-validated INSIDE the validation split: each candidate is fitted on K-1
  # folds and scored on the fold it did not see. Fitting and scoring on the same
  # rows would let isotonic regression report a near-zero error for a mapping
  # that had memorised them.
  candidates: [none, isotonic, platt]
  n_folds: 5
  fitted_on: validation          # never train, never test
  # TWO GATES, BECAUSE NEITHER METRIC IS SUFFICIENT ALONE.
  #
  # Expected calibration error is what we care about, but it is computed over ten
  # equal-width bins and is therefore noisy: on ~2,000 rows a perfectly
  # calibrated model still scores an ECE around 0.015 from sampling alone, and a
  # flexible calibrator can "improve" that by fitting the noise in those bins.
  #
  # The Brier score is a PROPER scoring rule: it cannot be improved by fitting
  # binning artefacts, only by producing genuinely better probabilities. So it is
  # used as a veto rather than as the objective - a candidate that makes the
  # proper score worse is rejected however good its ECE looks.
  metric: expected_calibration_error       # ranks the survivors
  tiebreaker: brier_score
  minimum_improvement: 0.002               # in ECE, against leaving scores alone
  max_brier_degradation: 0.0               # a candidate may not worsen the proper score

  # "none" wins ties and anything that fails either gate: correcting a score that
  # did not need it adds a fitted component, and therefore a way to be wrong, for
  # nothing.

guardrails:
  # A model that flags a quarter of all orders is an operational problem
  # regardless of its precision. Mirrors ladder.yaml's selection block.
  max_acceptable_flag_rate: 0.25
  # Refuse to ship a model that ranks worse than the do-nothing base rate.
  min_pr_auc_over_base_rate: 0.05
