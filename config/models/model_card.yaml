# =============================================================================
# Model card prose. Phase 5.
#
# THE NUMBERS ARE NOT HERE, AND THAT IS THE POINT.
# This file holds only the parts of a model card that are judgements: what the
# model is for, what it must not be used for, what is known to be wrong with it.
# Every metric in the rendered card is read from the measured evaluation
# artefacts at render time, so a card cannot claim a number the run did not
# produce.
#
# Rendered to docs/model_card.md by `rto-sentinel final`.
# =============================================================================
version: 1

model_name: RTO Sentinel risk model
owner: "RTO Sentinel project (Razorpay hiring challenge, Track 02)"

summary: >
  Estimates the probability that a specific order will be returned to origin,
  using only information available at the moment the order is placed. The output
  is a calibrated probability, not a decision: converting it into an action is
  the job of the economic decision layer, which compares it against a threshold
  derived from the merchant's own costs.

intended_use:
  - "Ranking incoming cash-on-delivery orders by RTO risk so that a limited
     intervention budget goes to the orders most likely to need it."
  - "Feeding the economic decision engine, which pairs the probability with a
     cost-derived threshold to choose an intervention."
  - "Offline analysis: measuring how much RTO loss a merchant could avoid at a
     given flag rate, and what that intervention would cost."
  - "Benchmarking simpler policies. The ladder it belongs to exists so that a
     blocklist or a blanket rule can win if it deserves to."

non_intended_use:
  - "Any automatic decision that a human cannot see, question or reverse. The
     model produces a probability; a person or an auditable rule decides."
  - "Blocking a customer, closing an account, or any punitive action against an
     individual. A high RTO probability is a logistics signal, not evidence of
     intent, and nothing in the training data can distinguish the two."
  - "Fraud detection or any adjacent inference about a person's honesty. RTO
     includes refused deliveries, wrong addresses, absent customers and changed
     minds; the label does not separate them."
  - "Creditworthiness, employment, insurance, or any decision covered by
     consumer-protection or lending rules. The model was neither designed nor
     validated for those, and the features would be inappropriate for them."
  - "Deployment on real merchant traffic. This model is trained on synthetic
     benchmark data and has never seen a real order."
  - "Pricing or charging an individual customer differently based on the score
     without an explicit, separately reviewed policy."

training_data:
  description: >
    A synthetic benchmark generated by this project's documented probabilistic
    simulator (see docs/simulator.md). Orders, customers, addresses, delivery
    events and outcomes are produced by a causal process whose parameters are
    anchored to published Indian e-commerce figures where such figures exist,
    with controlled stochastic noise so that the learning task is not the
    reverse-engineering of deterministic rules.
  synthetic_disclaimer: >
    THE LABELS ARE SIMULATED. They are outcomes of a process this project wrote,
    not observations of real returns. Every metric in this card is therefore a
    statement about the simulator, and none of them is evidence about production
    performance. A number here that looks good means the model learned the
    simulator; whether the simulator resembles Indian COD commerce is a separate
    question that this project does not claim to have settled.
  what_is_not_in_it:
    - "No real merchant, customer or courier data of any kind."
    - "No personally identifying information. Customers are hashes; addresses are
       generated strings; nothing traces to a person."
    - "No protected attributes. Gender, religion, caste, age and name are neither
       generated nor used, so the model cannot key on them directly."

features:
  description: >
    Six families, each independently ablatable, all restricted to information
    knowable when the order was placed. Every feature declares its source
    columns, lookback window and observation timestamp, and the leakage suite
    asserts that none of them moves when future information is removed.
  excluded_deliberately:
    - "Raw pincode. Available to the heuristic baselines through a separate
       argument, withheld from the learned model, because a model keying on raw
       geography concentrates friction on places rather than behaviours."
    - "Any post-order signal: delivery attempts, courier updates, resolution
       timestamps, the outcome itself."
    - "Any aggregate computed over orders that had not yet resolved at scoring
       time."

known_limitations:
  - "Trained and evaluated entirely on synthetic data. The absolute numbers do
     not transfer; only the relative comparisons between rungs are meaningful,
     and only within this benchmark."
  - "The simulator draws each order's risk from a linear combination on the logit
     scale. That makes the task unusually favourable to linear models and is the
     most likely reason logistic regression is competitive with, or better than,
     gradient boosting here. Real RTO risk is unlikely to be that well behaved."
  - "The smoothed pincode RTO-rate feature is null for the large majority of
     training rows: the simulated geography spreads orders over too many
     pincodes for the minimum-support guard to pass. The guard is correct; the
     feature is close to unavailable at this dataset size."
  - "Recall at 80% precision is very low. The model does not reach that precision
     except on a tiny top slice, and a workflow that requires it will not be
     served by this model."
  - "The validation split is roughly two thousand orders, so bootstrap intervals
     on every metric are wide. Differences smaller than a few points are noise,
     which is why model selection uses a one-standard-error rule rather than
     picking the highest number."
  - "One merchant profile, one cost profile, one seasonal window. Nothing here
     establishes behaviour across merchants, categories or seasons."

evaluation_methodology: >
  Splits are temporal windows inside disjoint customer pools: a customer appears
  in exactly one split, and validation and test come strictly after training in
  time. The test split is sealed and is opened once, after model selection,
  calibration selection and threshold methodology are frozen and written to a
  manifest. PR-AUC leads because the positive class is a minority and ROC-AUC
  flatters that; ROC-AUC is reported but never led with. Every point estimate
  carries a bootstrap confidence interval. The headline is net rupees saved per
  thousand orders relative to doing nothing, with the false-positive cost stated
  separately and never netted away.

calibration_methodology: >
  Calibration candidates are compared by five-fold cross-validation inside the
  validation split, so every calibrated score used for the comparison came from
  a mapping that had not seen that row. Leaving the scores uncorrected is one of
  the candidates and wins ties. The selected method is refitted on the whole
  validation split for the shipped artefact; the cross-validated figure remains
  the reported one, because the refit has seen every validation row it would be
  scored on. The calibrator never sees training rows (it would learn the model's
  own overfitting) and never sees test rows (that would break the seal).

fairness_limitations:
  - "No protected attributes exist in the data, so no direct discrimination is
     possible - and no fairness audit against them is possible either. Absence of
     evidence here is exactly that."
  - "Geography is the live fairness risk. Pincode tier correlates with income and
     region, and a model that concentrates flags on tier-3 pincodes imposes
     friction on places rather than on behaviour. Raw pincode is withheld from
     the model for this reason, but tier-level and smoothed geographic signals
     remain reachable through other features."
  - "The right question is whether precision holds up in the groups that get
     flagged most - a group flagged at twice the rate with the same precision is
     being served, while the same rate with worse precision is being penalised.
     Equalising flag rates is not the goal and would not be correct."
  - "The cohort audit is defined in config/evaluation.yaml and has not yet been
     run as part of this phase. Until it has, no fairness claim of any kind
     should be made about this model."

distribution_shift_limitations:
  - "Evaluated over a single fixed horizon. Festival peaks, courier changes,
     category mix shifts and merchant policy changes are all absent from the
     benchmark and would all move the score distribution."
  - "Customer-history features assume a stable order-arrival process. A merchant
     growing quickly, or a sudden influx of new customers, pushes a large share
     of orders into the cold-start path where those features are null."
  - "The calibration mapping is fitted on one validation window. Calibration is
     the first thing to decay under drift, and the decay is invisible without
     outcome monitoring - the reliability diagram must be recomputed on fresh
     outcomes before the probability can still be trusted."
  - "The cost inputs that derive the threshold are merchant-specific and change
     with margin, courier rates and intervention effectiveness. The threshold is
     recomputed from them rather than stored, so a stale cost input silently
     produces a wrong operating point."

maintenance:
  retraining_trigger: >
    Recompute the reliability diagram and the ranking metrics on matured outcomes
    on a rolling basis. Retrain when calibration error on fresh outcomes exceeds
    the level recorded at selection time, or when the flag rate at the derived
    threshold moves materially without a corresponding change in cost inputs.
  monitoring: >
    Track the score distribution, flag rate, and the share of orders falling into
    the cold-start path. Each of the three moves before the metrics do.
