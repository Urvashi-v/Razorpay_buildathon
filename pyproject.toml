[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rto-sentinel"
version = "0.1.0"
description = "Cost-calibrated return-to-origin risk scorer for Indian COD commerce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies for the scoring service and the ML pipeline.
# Kept deliberately small: every entry below is used by a named component in
# ARCHITECTURE.md. Nothing is here to pad the stack.
dependencies = [
  # --- configuration & contracts (all layers) ---
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6.0,<7",
  # --- backend / API ---
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  # --- database ---
  "SQLAlchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  # --- ML / data pipeline ---
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4.3,<5",
  "shap>=0.45,<1",
  # Evaluation plots: PR curves, reliability diagrams, threshold sweeps. Written
  # to artifacts/reports/ as PNGs rather than shown, so the harness stays usable
  # without a display.
  "matplotlib>=3.8,<4",
  "scipy>=1.12,<2",
  # Parquet is the dataset artefact format. A CSV round-trip loses exactly the
  # two dtypes that matter here: timezone-aware timestamps, and the difference
  # between a NULL label and the string "None".
  "pyarrow>=16.0,<24",
  # --- observability ---
  "structlog>=24.1,<26",
]

[project.optional-dependencies]
# The LLM layer is optional on purpose: the risk engine must run with it absent.
# See ARCHITECTURE.md section "Agent boundaries".
agents = [
  "anthropic>=0.34,<1",
]
dev = [
  "pytest>=8.1,<9",
  "pytest-cov>=5.0,<8",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "ruff>=0.4,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0,<7",
  "pandas-stubs>=2.2,<3",
]

[project.scripts]
rto-sentinel = "rto_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rto_sentinel = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "leakage: guards against train/test contamination (spec section 03)",
  "architecture: enforces the layering rules in ARCHITECTURE.md",
  "slow: excluded from the fast pre-commit loop",
  "requires_db: needs a live PostgreSQL instance (docker compose up db)",
  "requires_llm: needs ANTHROPIC_API_KEY; skipped by default and never in CI gates",
]
filterwarnings = ["error::DeprecationWarning:rto_sentinel.*"]

# ---------------------------------------------------------------------------
# ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade
  "B",         # bugbear
  "SIM",       # simplify
  "ANN",       # annotations
  "S",         # bandit-style security checks
  "PTH",       # prefer pathlib
  "RUF",
]
ignore = [
  "ANN401",  # allow typing.Any where a boundary genuinely needs it
  "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN201", "ANN001"]  # asserts and terse signatures are fine in tests
"migrations/**" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["rto_sentinel"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
# No `python_version` pin on purpose. Pinning it to 3.11 while running on a 3.12
# interpreter makes mypy parse the installed 3.12-only stubs (numpy ships `type`
# statements) under 3.11 grammar and abort. Letting mypy follow the interpreter
# means the check always matches the environment it runs in; 3.11 compatibility
# of our own code is guaranteed by `requires-python` and by CI running the
# minimum supported version.
mypy_path = "src"
packages = ["rto_sentinel"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party scientific stack ships incomplete or absent type information.
module = [
    # The Anthropic SDK is an optional dependency: the risk system installs and
    # runs without it, and `get_provider` reports an unavailable language layer
    # rather than failing at import. mypy must therefore tolerate its absence.
    "anthropic.*",
    "joblib.*",
    "lightgbm.*",
    "shap.*",
    "sklearn.*",
    "scipy.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/rto_sentinel"]
branch = true
