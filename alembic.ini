# Alembic configuration.
#
# NOTE: sqlalchemy.url is deliberately EMPTY here. The URL carries a password,
# and a password does not belong in a committed file. migrations/env.py reads it
# from rto_sentinel.settings at runtime, which is the same code path the
# application uses - so migrations can never run against a different database
# than the one the app talks to.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url =

# No post-write hooks. A hook that shells out to a formatter fails differently
# depending on how the environment was activated, and a migration that half-wrote
# because a formatter was missing is a worse problem than an unformatted one.
# `ruff format` runs over migrations/ in scripts/check.sh like everything else.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
